<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>Absensi SDM</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f1f3f6;
  font-family: Arial, sans-serif;
}

.header {
  background: #a90000;
  color: white;
  text-align: center;
  padding: 18px;
}

.header h1 {
  margin: 0;
  font-size: 27px;
}

.header p {
  margin: 5px 0 0;
}

.container {
  max-width: 600px;
  margin: 15px auto;
  padding: 10px;
}

.card {
  background: white;
  padding: 16px;
  border-radius: 16px;
  margin-bottom: 14px;
  box-shadow: 0 4px 18px rgba(0,0,0,.08);
}

label {
  font-weight: bold;
  display: block;
  margin-bottom: 7px;
}

input {
  width: 100%;
  padding: 13px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
}

.camera-box {
  position: relative;
  background: #111;
  border-radius: 15px;
  overflow: hidden;
  width: 100%;
  aspect-ratio: 3/4;
}

video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.face-frame {
  position: absolute;
  width: 65%;
  height: 58%;
  left: 17.5%;
  top: 20%;
  border: 3px solid white;
  border-radius: 50%;
  pointer-events: none;
}

.status {
  margin-top: 12px;
  background: #fff0c2;
  padding: 12px;
  border-radius: 9px;
  text-align: center;
}

button {
  width: 100%;
  border: none;
  padding: 15px;
  border-radius: 9px;
  margin-top: 10px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.masuk {
  background: #16853c;
  color: white;
}

.pulang {
  background: #b42323;
  color: white;
}

.daftar {
  background: #a90000;
  color: white;
}

button:disabled {
  opacity: .45;
}

.message {
  margin-top: 12px;
  padding: 13px;
  border-radius: 9px;
  text-align: center;
  background: #eee;
}

.success {
  background: #d7f4dd;
  color: #17652c;
}

.error {
  background: #ffdcdc;
  color: #8b0000;
}

.info {
  color: #555;
  text-align: center;
  font-size: 14px;
}

</style>

</head>


<body>


<div class="header">

<h1>ABSENSI SDM</h1>

<p>Bawaslu Kota Tidore Kepulauan</p>

</div>


<div class="container">


<div class="card">

<label>
NIP / NIK Pegawai
</label>

<input
  id="nip"
  type="text"
  placeholder="Masukkan NIP/NIK"
  autocomplete="off">

<div
  id="pegawai"
  class="message">

Silakan masukkan NIP/NIK.

</div>

</div>


<div class="card">

<div class="camera-box">

<video
  id="video"
  autoplay
  playsinline
  muted>
</video>

<div class="face-frame"></div>

</div>


<div
  id="cameraStatus"
  class="status">

Memulai kamera...

</div>


<button
  class="masuk"
  id="btnMasuk"
  onclick="absen('MASUK')"
  disabled>

✓ ABSEN MASUK

</button>


<button
  class="pulang"
  id="btnPulang"
  onclick="absen('PULANG')"
  disabled>

↪ ABSEN PULANG

</button>

</div>


<div class="card">

<h2>🔐 Registrasi Face ID</h2>

<p class="info">

Fitur ini menyimpan data wajah pegawai
untuk kebutuhan identifikasi pada sistem.

</p>

<button
  class="daftar"
  onclick="daftarkanWajah()">

DAFTARKAN WAJAH

</button>

<div
  id="registerMessage"
  class="message hidden">
</div>

</div>


<div
  id="result"
  class="message hidden">
</div>


</div>


<canvas
  id="canvas"
  style="display:none">
</canvas>


<script>

/* ==================================================
   URL GOOGLE APPS SCRIPT
================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbxO97It0vd-zPX-Qhz322uVxjgdmRHj0w5po0qGgLnJ9SpDHvlhHXv1iEP8YjUumgw/exec";


/* ==================================================
   VARIABEL
================================================== */

let video =
document.getElementById('video');

let stream = null;

let currentEmployee = null;

let currentPosition = null;


/* ==================================================
   START
================================================== */

window.addEventListener(
  'load',
  function() {

    startCamera();

    getLocation();

  }
);


/* ==================================================
   KAMERA
================================================== */

async function startCamera() {

  try {

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: 'user',
          width: {
            ideal: 720
          },
          height: {
            ideal: 960
          }
        },

        audio: false

      });

    video.srcObject = stream;

    setCameraStatus(
      'Kamera aktif. Posisikan wajah di tengah.'
    );

  } catch (error) {

    setCameraStatus(
      'Kamera tidak dapat digunakan. ' +
      'Pastikan izin kamera sudah diberikan.'
    );

  }
}


/* ==================================================
   GPS
================================================== */

function getLocation() {

  if (!navigator.geolocation) {

    setCameraStatus(
      'GPS tidak didukung perangkat ini.'
    );

    return;
  }


  navigator.geolocation.getCurrentPosition(

    function(position) {

      currentPosition = {

        latitude:
          position.coords.latitude,

        longitude:
          position.coords.longitude,

        accuracy:
          position.coords.accuracy

      };

      setCameraStatus(
        'Kamera dan GPS siap.'
      );

      updateButton();

    },

    function(error) {

      setCameraStatus(
        'GPS belum diizinkan. ' +
        'Aktifkan lokasi pada HP.'
      );

    },

    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }

  );

}


/* ==================================================
   CEK NIP
================================================== */

document
  .getElementById('nip')
  .addEventListener(
    'change',
    cekPegawai
  );


document
  .getElementById('nip')
  .addEventListener(
    'blur',
    cekPegawai
  );


async function cekPegawai() {

  let nip =
    document
      .getElementById('nip')
      .value
      .trim();

  if (!nip) {

    currentEmployee = null;

    document
      .getElementById('pegawai')
      .innerText =
      'Silakan masukkan NIP/NIK.';

    updateButton();

    return;
  }


  document
    .getElementById('pegawai')
    .innerText =
    'Memeriksa data pegawai...';


  try {

    let url =
      API_URL +
      '?action=employee&nip=' +
      encodeURIComponent(nip);


    let response =
      await fetch(url);


    let result =
      await response.json();


    if (result.success) {

      currentEmployee =
        result.employee;


      document
        .getElementById('pegawai')
        .className =
        'message success';


      document
        .getElementById('pegawai')
        .innerHTML =

        '<b>' +
        escapeHtml(currentEmployee.nama) +
        '</b><br>' +

        escapeHtml(
          currentEmployee.jabatan || ''
        ) +

        '<br>' +

        'Status: ' +
        escapeHtml(
          currentEmployee.status || ''
        );


    } else {

      currentEmployee = null;

      document
        .getElementById('pegawai')
        .className =
        'message error';

      document
        .getElementById('pegawai')
        .innerText =
        result.message;

    }

  } catch (error) {

    currentEmployee = null;

    document
      .getElementById('pegawai')
      .className =
      'message error';

    document
      .getElementById('pegawai')
      .innerText =
      'Gagal terhubung ke server Google Apps Script.';

  }

  updateButton();

}


/* ==================================================
   BUTTON
================================================== */

function updateButton() {

  let ready =
    currentEmployee &&
    currentPosition &&
    stream;

  document
    .getElementById('btnMasuk')
    .disabled =
    !ready;

  document
    .getElementById('btnPulang')
    .disabled =
    !ready;
}


/* ==================================================
   FOTO
================================================== */

function capturePhoto() {

  let canvas =
    document.getElementById('canvas');

  let context =
    canvas.getContext('2d');


  canvas.width =
    video.videoWidth;

  canvas.height =
    video.videoHeight;


  context.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );


  return canvas.toDataURL(
    'image/jpeg',
    0.65
  );
}


/* ==================================================
   ABSEN
================================================== */

async function absen(jenis) {

  if (!currentEmployee) {

    showResult(
      'Masukkan NIP/NIK yang sudah terdaftar.',
      false
    );

    return;
  }


  if (!currentPosition) {

    showResult(
      'Lokasi GPS belum tersedia.',
      false
    );

    getLocation();

    return;
  }


  let foto =
    capturePhoto();


  showResult(
    'Mengirim data absensi...',
    null
  );


  let data = new URLSearchParams();

  data.append(
    'action',
    'attendance'
  );

  data.append(
    'nip',
    currentEmployee.nip
  );

  data.append(
    'jenis',
    jenis
  );

  data.append(
    'latitude',
    currentPosition.latitude
  );

  data.append(
    'longitude',
    currentPosition.longitude
  );

  data.append(
    'accuracy',
    currentPosition.accuracy
  );

  data.append(
    'foto',
    foto
  );


  try {

    /*
     * sendBeacon digunakan supaya request
     * tetap dapat dikirim dari GitHub Pages
     * ke Apps Script tanpa masalah CORS
     */

    let sent =
      navigator.sendBeacon(
        API_URL,
        data
      );


    if (sent) {

      showResult(
        'Data absensi telah dikirim. ' +
        'Silakan tunggu beberapa detik lalu cek hasil pada sistem.',
        true
      );

    } else {

      showResult(
        'Data gagal dikirim ke server.',
        false
      );

    }

  } catch (error) {

    showResult(
      'Gagal mengirim data ke server.',
      false
    );

  }

}


/* ==================================================
   DAFTAR WAJAH
================================================== */

async function daftarkanWajah() {

  if (!currentEmployee) {

    showRegister(
      'Masukkan NIP/NIK pegawai terlebih dahulu.',
      false
    );

    return;
  }


  let foto =
    capturePhoto();


  /*
   * Untuk versi stabil lintas HP,
   * foto wajah digunakan sebagai data
   * pendaftaran wajah.
   */

  showRegister(
    'Mengirim pendaftaran wajah...',
    null
  );


  let data =
    new URLSearchParams();


  data.append(
    'action',
    'register_face'
  );


  data.append(
    'nip',
    currentEmployee.nip
  );


  data.append(
    'faceId',
    foto
  );


  try {

    let sent =
      navigator.sendBeacon(
        API_URL,
        data
      );


    if (sent) {

      showRegister(
        'Pendaftaran wajah telah dikirim.',
        true
      );

      currentEmployee.faceId =
        'TERDAFTAR';

    } else {

      showRegister(
        'Gagal mengirim pendaftaran wajah.',
        false
      );

    }

  } catch (error) {

    showRegister(
      'Gagal terhubung ke server.',
      false
    );

  }

}


/* ==================================================
   STATUS
================================================== */

function setCameraStatus(text) {

  document
    .getElementById('cameraStatus')
    .innerText =
    text;

}


function showResult(text, success) {

  let el =
    document.getElementById('result');

  el.className =
    'message ' +
    (
      success === true
        ? 'success'
        : success === false
        ? 'error'
        : ''
    );

  el.innerText =
    text;

  el.classList.remove('hidden');

}


function showRegister(text, success) {

  let el =
    document
      .getElementById('registerMessage');

  el.className =
    'message ' +
    (
      success === true
        ? 'success'
        : success === false
        ? 'error'
        : ''
    );

  el.innerText =
    text;

  el.classList.remove('hidden');

}


/* ==================================================
   HTML SECURITY
================================================== */

function escapeHtml(text) {

  return String(text || '')
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );

}

</script>

</body>

</html>
