<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1.0">

<title>SOBAI GAI - Absensi</title>

<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#101820;
  color:#fff;
}

.header{
  background:#b40000;
  text-align:center;
  padding:18px;
}

.header h1{
  margin:0;
  font-size:25px;
}

.header p{
  margin:5px 0 0;
}

.container{
  width:680px;
  max-width:95%;
  margin:20px auto;
}

.card{
  background:#202020;
  border-radius:16px;
  padding:20px;
  margin-bottom:15px;
}

label{
  display:block;
  font-weight:bold;
  margin-bottom:7px;
}

input{
  width:100%;
  padding:14px;
  border-radius:9px;
  border:0;
  font-size:16px;
}

.camera-box{
  position:relative;
  background:#000;
  border-radius:15px;
  overflow:hidden;
  min-height:430px;
  display:flex;
  align-items:center;
  justify-content:center;
}

video{
  width:100%;
  max-height:500px;
  object-fit:cover;
  transform:scaleX(-1);
}

.face-frame{
  position:absolute;
  width:70%;
  height:65%;
  border:3px solid #fff;
  border-radius:45%;
  pointer-events:none;
}

.status{
  padding:13px;
  border-radius:8px;
  text-align:center;
  margin-top:12px;
  background:#444;
}

.status.ok{
  background:#075c30;
}

.status.error{
  background:#870000;
}

.status.warning{
  background:#795600;
}

.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}

button{
  padding:15px;
  border:0;
  border-radius:9px;
  font-size:15px;
  font-weight:bold;
  color:#fff;
  cursor:pointer;
}

.btn-in{
  background:#07853f;
}

.btn-out{
  background:#b40000;
}

.btn-face{
  background:#1476d4;
  width:100%;
}

.btn-location{
  background:#7044d8;
  width:100%;
  margin-top:10px;
}

button:disabled{
  opacity:.45;
}

.result{
  margin-top:15px;
  padding:15px;
  background:#333;
  border-radius:9px;
}

.info{
  font-size:13px;
  line-height:1.7;
  color:#ddd;
}

@media(max-width:600px){

  .container{
    max-width:100%;
    margin:0;
  }

  .card{
    border-radius:0;
    margin-bottom:2px;
  }

  .camera-box{
    min-height:420px;
  }

  .buttons{
    grid-template-columns:1fr;
  }

}

</style>

</head>

<body>


<div class="header">

  <h1>
    SOBAI <span style="color:#ff3c3c">GAI</span>
  </h1>

  <p>
    Sistem Online Bawaslu Absen Terintegratif
  </p>

  <small>
    Bawaslu Kota Tidore Kepulauan
  </small>

</div>


<div class="container">


<!-- NIP -->

<div class="card">

  <label>
    NIP / NIK Pegawai
  </label>

  <input
    id="nip"
    placeholder="Masukkan NIP/NIK">

  <div
    id="employeeInfo"
    class="result"
    style="display:none">
  </div>

</div>


<!-- CAMERA -->

<div class="card">

  <div class="camera-box">

    <video
      id="video"
      autoplay
      muted
      playsinline>
    </video>

    <div class="face-frame"></div>

  </div>

  <div
    id="cameraStatus"
    class="status warning">

    Menyiapkan kamera...

  </div>

</div>


<!-- GPS -->

<div class="card">

  <button
    class="btn-location"
    onclick="checkLocation()">

    📍 CEK LOKASI KANTOR

  </button>

  <div
    id="locationStatus"
    class="status warning">

    Lokasi belum diperiksa.

  </div>

</div>


<!-- FACE -->

<div class="card">

  <h2>
    🔐 Registrasi Face ID
  </h2>

  <div class="info">

    Pastikan satu wajah berada di tengah
    bingkai dan pencahayaan cukup.

  </div>

  <button
    id="registerFaceBtn"
    class="btn-face"
    onclick="registerFace()"
    disabled>

    DAFTARKAN WAJAH

  </button>

</div>


<!-- ABSEN -->

<div class="card">

  <h2>
    📍 Absensi
  </h2>

  <div class="buttons">

    <button
      id="btnMasuk"
      class="btn-in"
      onclick="submitAttendance('MASUK')"
      disabled>

      ✓ ABSEN MASUK

    </button>

    <button
      id="btnPulang"
      class="btn-out"
      onclick="submitAttendance('PULANG')"
      disabled>

      ↪ ABSEN PULANG

    </button>

  </div>

</div>


<div
  id="result"
  class="result">

  Sistem belum melakukan absensi.

</div>


</div>


<script>

/* =====================================================
   CONFIG
===================================================== */

const CONFIG = {

  threshold: 0.55,

  modelUrl:
    'https://cdn.jsdelivr.net/gh/vladmandic/face-api/model'

};


/* =====================================================
   STATE
===================================================== */

let video =
  document.getElementById('video');

let stream = null;

let modelsReady = false;

let currentEmployee = null;

let currentDescriptor = null;

let currentFaceDistance = null;

let currentLocation = null;

let settings = null;


/* =====================================================
   LOAD
===================================================== */

window.addEventListener(
  'load',
  async function(){

    await loadSettings();

    await loadModels();

    await startCamera();

  }
);


/* =====================================================
   SETTINGS
===================================================== */

function loadSettings(){

  return new Promise(function(resolve){

    google.script.run
      .withSuccessHandler(function(data){

        settings = data;

        resolve();

      })
      .withFailureHandler(function(err){

        setStatus(
          'cameraStatus',
          'Gagal mengambil pengaturan server: ' +
          err.message,
          'error'
        );

        resolve();

      })
      .getSettings();

  });

}


/* =====================================================
   MODELS
===================================================== */

async function loadModels(){

  try{

    setStatus(
      'cameraStatus',
      'Memuat sistem Face ID...',
      'warning'
    );

    await faceapi.nets.tinyFaceDetector
      .loadFromUri(
        CONFIG.modelUrl
      );

    await faceapi.nets.faceLandmark68TinyNet
      .loadFromUri(
        CONFIG.modelUrl
      );

    await faceapi.nets.faceRecognitionNet
      .loadFromUri(
        CONFIG.modelUrl
      );

    modelsReady = true;

    setStatus(
      'cameraStatus',
      'Face ID siap. Menyiapkan kamera...',
      'ok'
    );

  }catch(error){

    console.error(error);

    setStatus(
      'cameraStatus',
      'Model Face ID gagal dimuat. Periksa internet HP.',
      'error'
    );

  }

}


/* =====================================================
   CAMERA
===================================================== */

async function startCamera(){

  try{

    stream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:'user',
          width:{
            ideal:720
          },
          height:{
            ideal:720
          }
        },

        audio:false

      });

    video.srcObject = stream;

    setStatus(
      'cameraStatus',
      'Kamera aktif. Posisikan wajah di tengah.',
      'ok'
    );

    video.onloadedmetadata =
      function(){

        detectFace();

      };

  }catch(error){

    console.error(error);

    setStatus(
      'cameraStatus',
      'Gagal menyiapkan kamera: ' +
      error.message,
      'error'
    );

  }

}


/* =====================================================
   FACE DETECTION
===================================================== */

async function detectFace(){

  if(
    !modelsReady ||
    video.readyState < 2
  ){

    setTimeout(
      detectFace,
      1000
    );

    return;
  }

  try{

    const result =
      await faceapi
        .detectSingleFace(
          video,
          new faceapi.TinyFaceDetectorOptions({
            inputSize:320,
            scoreThreshold:0.5
          })
        )
        .withFaceLandmarks(
          true
        )
        .withFaceDescriptor();

    if(result){

      currentDescriptor =
        Array.from(
          result.descriptor
        );

      document
        .getElementById(
          'registerFaceBtn'
        )
        .disabled = false;

      if(
        currentEmployee &&
        currentEmployee.faceId
      ){

        const saved =
          parseDescriptor(
            currentEmployee.faceId
          );

        if(saved){

          const distance =
            euclideanDistance(
              currentDescriptor,
              saved
            );

          currentFaceDistance =
            distance;

          if(
            distance <=
            Number(
              settings.faceThreshold ||
              CONFIG.threshold
            )
          ){

            setStatus(
              'cameraStatus',
              '✓ Wajah cocok. Face Match: ' +
              distance.toFixed(3),
              'ok'
            );

          }else{

            setStatus(
              'cameraStatus',
              'Wajah belum cocok. Jarak: ' +
              distance.toFixed(3),
              'warning'
            );

          }

        }

      }else{

        setStatus(
          'cameraStatus',
          '✓ Wajah terdeteksi.',
          'ok'
        );

      }

    }else{

      currentDescriptor = null;

      document
        .getElementById(
          'registerFaceBtn'
        )
        .disabled = true;

      setStatus(
        'cameraStatus',
        'Arahkan wajah ke tengah bingkai.',
        'warning'
      );

    }

  }catch(error){

    console.error(error);

  }

  setTimeout(
    detectFace,
    800
  );

}


/* =====================================================
   NIP CHANGE
===================================================== */

document
  .getElementById('nip')
  .addEventListener(
    'change',
    loadEmployee
  );

document
  .getElementById('nip')
  .addEventListener(
    'blur',
    loadEmployee
  );


function loadEmployee(){

  const nip =
    document.getElementById(
      'nip'
    ).value.trim();

  if(!nip){
    return;
  }

  google.script.run
    .withSuccessHandler(function(result){

      const box =
        document.getElementById(
          'employeeInfo'
        );

      if(!result.success){

        currentEmployee = null;

        box.style.display = 'block';

        box.innerHTML =
          '❌ ' +
          escapeHtml(
            result.message
          );

        enableButtons();

        return;
      }

      currentEmployee =
        result.employee;

      box.style.display =
        'block';

      box.innerHTML =

        '<strong>' +
        escapeHtml(
          currentEmployee.nama
        ) +
        '</strong><br>' +

        escapeHtml(
          currentEmployee.jabatan
        ) +
        '<br>' +

        (
          currentEmployee.faceId
          ? '🔐 Face ID sudah terdaftar'
          : '⚠️ Face ID belum terdaftar'
        );

      enableButtons();

    })
    .getEmployee(nip);

}


/* =====================================================
   LOCATION
===================================================== */

function checkLocation(){

  if(
    !navigator.geolocation
  ){

    setStatus(
      'locationStatus',
      'GPS tidak didukung oleh perangkat.',
      'error'
    );

    return;
  }

  setStatus(
    'locationStatus',
    'Mengambil lokasi GPS...',
    'warning'
  );

  navigator.geolocation.getCurrentPosition(

    function(position){

      const lat =
        position.coords.latitude;

      const lng =
        position.coords.longitude;

      const accuracy =
        position.coords.accuracy;

      const distance =
        calculateDistance(
          lat,
          lng,
          Number(settings.latitude),
          Number(settings.longitude)
        );

      currentLocation = {

        latitude:lat,
        longitude:lng,
        accuracy:accuracy,
        distance:distance

      };

      if(
        distance <=
        Number(settings.radius)
      ){

        setStatus(
          'locationStatus',
          '✓ Lokasi valid. Jarak dari kantor: ' +
          Math.round(distance) +
          ' meter.',
          'ok'
        );

      }else{

        setStatus(
          'locationStatus',
          '❌ Di luar radius. Jarak: ' +
          Math.round(distance) +
          ' meter. Radius: ' +
          settings.radius +
          ' meter.',
          'error'
        );

      }

      enableButtons();

    },

    function(error){

      setStatus(
        'locationStatus',
        'GPS gagal: ' +
        error.message,
        'error'
      );

    },

    {
      enableHighAccuracy:true,
      timeout:15000,
      maximumAge:0
    }

  );

}


/* =====================================================
   REGISTER FACE
===================================================== */

function registerFace(){

  if(!currentEmployee){

    alert(
      'Masukkan NIP/NIK terlebih dahulu.'
    );

    return;
  }

  if(!currentDescriptor){

    alert(
      'Wajah belum terdeteksi.'
    );

    return;
  }

  if(
    !confirm(
      'Daftarkan wajah untuk ' +
      currentEmployee.nama +
      '?'
    )
  ){

    return;
  }

  setStatus(
    'cameraStatus',
    'Menyimpan Face ID...',
    'warning'
  );

  google.script.run
    .withSuccessHandler(function(result){

      if(result.success){

        alert(
          'Face ID berhasil didaftarkan.'
        );

        currentEmployee.faceId =
          JSON.stringify(
            currentDescriptor
          );

        setStatus(
          'cameraStatus',
          '✓ Face ID berhasil disimpan.',
          'ok'
        );

      }else{

        alert(result.message);

      }

    })
    .withFailureHandler(function(err){

      alert(
        'Gagal menyimpan Face ID: ' +
        err.message
      );

    })
    .saveFaceId(
      currentEmployee.nip,
      JSON.stringify(
        currentDescriptor
      )
    );

}


/* =====================================================
   ATTENDANCE
===================================================== */

function submitAttendance(jenis){

  if(!currentEmployee){

    alert(
      'Masukkan NIP/NIK pegawai.'
    );

    return;
  }

  if(!currentLocation){

    alert(
      'Silakan cek lokasi GPS terlebih dahulu.'
    );

    return;
  }

  if(
    currentLocation.distance >
    Number(settings.radius)
  ){

    alert(
      'Anda berada di luar radius kantor.'
    );

    return;
  }

  if(!currentDescriptor){

    alert(
      'Wajah belum terdeteksi.'
    );

    return;
  }

  let faceMatch = 0;

  if(currentEmployee.faceId){

    const saved =
      parseDescriptor(
        currentEmployee.faceId
      );

    if(saved){

      faceMatch =
        euclideanDistance(
          currentDescriptor,
          saved
        );

      if(
        faceMatch >
        Number(
          settings.faceThreshold ||
          CONFIG.threshold
        )
      ){

        alert(
          'Face ID tidak cocok.\n' +
          'Jarak wajah: ' +
          faceMatch.toFixed(3)
        );

        return;
      }

    }

  }else{

    alert(
      'Pegawai belum memiliki Face ID. Daftarkan wajah terlebih dahulu.'
    );

    return;
  }


  setStatus(
    'result',
    'Mengirim absensi...',
    'warning'
  );

  const canvas =
    document.createElement('canvas');

  canvas.width = 480;
  canvas.height = 360;

  const ctx =
    canvas.getContext('2d');

  ctx.translate(
    canvas.width,
    0
  );

  ctx.scale(-1,1);

  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );

  const photo =
    canvas.toDataURL(
      'image/jpeg',
      0.65
    );

  const data = {

    nip:
      currentEmployee.nip,

    jenis:
      jenis,

    latitude:
      currentLocation.latitude,

    longitude:
      currentLocation.longitude,

    accuracy:
      currentLocation.accuracy,

    faceMatch:
      faceMatch,

    photo:
      photo

  };


  google.script.run
    .withSuccessHandler(function(result){

      if(result.success){

        setStatus(
          'result',
          '✓ ' +
          result.message +
          ' ' +
          result.nama +
          ' - ' +
          result.jam +
          ' WIT. Jarak ' +
          result.jarak +
          ' meter.',
          'ok'
        );

      }else{

        setStatus(
          'result',
          '❌ ' +
          result.message,
          'error'
        );

      }

    })
    .withFailureHandler(function(err){

      setStatus(
        'result',
        '❌ Server error: ' +
        err.message,
        'error'
      );

    })
    .saveAttendance(data);

}


/* =====================================================
   ENABLE BUTTONS
===================================================== */

function enableButtons(){

  const ready =
    currentEmployee &&
    currentLocation &&
    currentLocation.distance <=
      Number(settings.radius) &&
    currentDescriptor;

  document
    .getElementById(
      'btnMasuk'
    )
    .disabled = !ready;

  document
    .getElementById(
      'btnPulang'
    )
    .disabled = !ready;

}


/* =====================================================
   DISTANCE
===================================================== */

function calculateDistance(
  lat1,
  lon1,
  lat2,
  lon2
){

  const R =
    6371000;

  const p1 =
    lat1 * Math.PI / 180;

  const p2 =
    lat2 * Math.PI / 180;

  const dp =
    (lat2-lat1) *
    Math.PI / 180;

  const dl =
    (lon2-lon1) *
    Math.PI / 180;

  const a =
    Math.sin(dp/2) *
    Math.sin(dp/2) +

    Math.cos(p1) *
    Math.cos(p2) *
    Math.sin(dl/2) *
    Math.sin(dl/2);

  const c =
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1-a)
    );

  return R*c;

}


/* =====================================================
   FACE DISTANCE
===================================================== */

function euclideanDistance(a,b){

  if(
    !a ||
    !b ||
    a.length !== b.length
  ){
    return 999;
  }

  let sum = 0;

  for(
    let i=0;
    i<a.length;
    i++
  ){

    const d =
      a[i] - b[i];

    sum += d*d;

  }

  return Math.sqrt(sum);

}


/* =====================================================
   PARSE DESCRIPTOR
===================================================== */

function parseDescriptor(value){

  try{

    const parsed =
      JSON.parse(value);

    if(
      Array.isArray(parsed) &&
      parsed.length === 128
    ){

      return parsed;
    }

  }catch(e){}

  return null;

}


/* =====================================================
   STATUS
===================================================== */

function setStatus(
  id,
  message,
  type
){

  const el =
    document.getElementById(id);

  if(!el){
    return;
  }

  el.textContent =
    message;

  el.className =
    'status ' +
    (type || '');

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(value){

  return String(value || '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');

}

</script>

</body>
</html>
