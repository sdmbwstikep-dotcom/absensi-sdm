<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0">

<title>
Absensi Wajah
</title>

<script
src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js">
</script>

<style>

body {
  margin: 0;
  background: #171717;
  color: white;
  font-family: Arial, sans-serif;
}

.header {
  background: #a90000;
  text-align: center;
  padding: 18px;
}

.header h1 {
  margin: 0;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 15px;
}

.card {
  background: #222;
  padding: 18px;
  border-radius: 15px;
  margin-bottom: 15px;
}

input {
  width: 100%;
  padding: 14px;
  border-radius: 8px;
  border: 0;
  box-sizing: border-box;
  margin-top: 7px;
  margin-bottom: 12px;
  font-size: 16px;
}

.camera {
  position: relative;
  width: 100%;
  background: black;
  border-radius: 15px;
  overflow: hidden;
}

video {
  width: 100%;
  display: block;
  transform: scaleX(-1);
}

.facebox {
  position: absolute;
  width: 58%;
  height: 62%;
  border: 3px solid white;
  border-radius: 45%;
  top: 19%;
  left: 21%;
  pointer-events: none;
}

.status {
  background: #333;
  padding: 14px;
  border-radius: 8px;
  margin-top: 12px;
  text-align: center;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 10px;
  border: 0;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
}

.green {
  background: #16843d;
  color: white;
}

.red {
  background: #a90000;
  color: white;
}

.blue {
  background: #1769aa;
  color: white;
}

.orange {
  background: #e68a00;
  color: white;
}

.success {
  background: #145c2b;
  padding: 15px;
  border-radius: 10px;
  margin-top: 10px;
}

.error {
  background: #7c1010;
  padding: 15px;
  border-radius: 10px;
  margin-top: 10px;
}

.small {
  color: #bbb;
  font-size: 13px;
}

</style>

</head>


<body>


<div class="header">

<h1>
ABSENSI SDM
</h1>

<div>
Bawaslu Kota Tidore Kepulauan
</div>

</div>


<div class="container">


<div class="card">

<label>
NIP / NIK Pegawai
</label>

<input
id="nip"
placeholder="Masukkan NIP/NIK"
>

<div id="employeeInfo"
     class="small">
Silakan masukkan NIP/NIK.
</div>

</div>


<div class="card">

<div class="camera">

<video
id="video"
autoplay
muted
playsinline>
</video>

<div class="facebox"></div>

</div>

<div
id="status"
class="status">

Menyiapkan kamera...

</div>


<button
class="blue"
onclick="startCamera()">

📷 AKTIFKAN KAMERA

</button>

</div>


<div class="card">

<button
class="green"
onclick="absen('MASUK')">

✓ ABSEN MASUK

</button>

<button
class="red"
onclick="absen('PULANG')">

↪ ABSEN PULANG

</button>

</div>


<div
id="registration"
class="card">

<h2>
🔐 Registrasi Face ID
</h2>

<p>
Gunakan satu wajah di tengah bingkai.
Pastikan pencahayaan cukup.
</p>

<button
class="orange"
onclick="registerFace()">

📷 DAFTARKAN / PERBARUI WAJAH

</button>

</div>


<div id="result"></div>


</div>


<script>

/* =====================================================
   KONFIGURASI
===================================================== */

const API_URL =
  'https://script.google.com/macros/s/' +
  'AKfycbxO97It0vd-zPX-Qhz322uVxjgdmRHj0w5po0qGgLnJ9SpDHvlhHXv1iEP8YjUumgw' +
  '/exec';

const MODEL_URL =
  'https://cdn.jsdelivr.net/gh/' +
  'justadudewhohacks/face-api.js@0.22.2/weights';


let stream = null;

let modelsLoaded = false;

let currentEmployee = null;

let currentSettings = null;

let mode =
  new URLSearchParams(
    window.location.search
  ).get('mode') || 'attendance';


/* =====================================================
   SAAT HALAMAN DIBUKA
===================================================== */

window.onload = async function() {

  const nip =
    new URLSearchParams(
      window.location.search
    ).get('nip');

  if (nip) {

    document
      .getElementById('nip')
      .value = nip;

  }

  if (
    mode !== 'register'
  ) {

    document
      .getElementById(
        'registration'
      )
      .style.display =
      'none';
  }

  setStatus(
    'Memuat sistem Face Recognition...'
  );

  try {

    await loadModels();

    await startCamera();

    await loadSettings();

    if (nip) {
      cekPegawai();
    }

  } catch (error) {

    setStatus(
      'Gagal memuat sistem: ' +
      error.message
    );
  }
};


/* =====================================================
   LOAD MODEL
===================================================== */

async function loadModels() {

  if (modelsLoaded) {
    return;
  }

  setStatus(
    'Memuat model pengenalan wajah...'
  );

  await Promise.all([

    faceapi
      .nets
      .tinyFaceDetector
      .loadFromUri(
        MODEL_URL
      ),

    faceapi
      .nets
      .faceLandmark68TinyNet
      .loadFromUri(
        MODEL_URL
      ),

    faceapi
      .nets
      .faceRecognitionNet
      .loadFromUri(
        MODEL_URL
      )
  ]);

  modelsLoaded = true;

  setStatus(
    'Model wajah siap.'
  );
}


/* =====================================================
   CAMERA
===================================================== */

async function startCamera() {

  const video =
    document
      .getElementById('video');

  if (stream) {

    video.srcObject =
      stream;

    return;
  }

  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    throw new Error(
      'Browser tidak mendukung kamera HTTPS.'
    );
  }

  stream =
    await navigator
      .mediaDevices
      .getUserMedia({

        video: {

          facingMode:
            'user',

          width: {
            ideal: 720
          },

          height: {
            ideal: 720
          }

        },

        audio: false

      });

  video.srcObject =
    stream;

  await video.play();

  setStatus(
    'Kamera aktif. Posisikan wajah di dalam lingkaran.'
  );
}


/* =====================================================
   SETTINGS
===================================================== */

async function loadSettings() {

  currentSettings =
    await api(
      'getSettings',
      {}
    );

  if (
    currentSettings &&
    currentSettings.settings
  ) {

    currentSettings =
      currentSettings.settings;
  }
}


/* =====================================================
   CEK PEGAWAI
===================================================== */

async function cekPegawai() {

  const nip =
    document
      .getElementById('nip')
      .value
      .trim();

  if (!nip) {

    document
      .getElementById(
        'employeeInfo'
      )
      .innerHTML =
      'NIP/NIK belum diisi.';

    currentEmployee = null;

    return;
  }

  try {

    const result =
      await api(
        'getEmployee',
        {
          nip: nip
        }
      );

    if (!result.success) {

      currentEmployee = null;

      document
        .getElementById(
          'employeeInfo'
        )
        .innerHTML =
        '<span style="color:#ff7777">' +
        result.message +
        '</span>';

      return;
    }

    currentEmployee =
      result.employee;

    document
      .getElementById(
        'employeeInfo'
      )
      .innerHTML =

      '<b>' +
      escapeHtml(
        currentEmployee.nama
      ) +
      '</b><br>' +

      escapeHtml(
        currentEmployee.jabatan
      ) +

      '<br>' +

      (
        currentEmployee.faceId
          ? '✅ Face ID terdaftar'
          : '❌ Face ID belum terdaftar'
      );

  } catch (error) {

    document
      .getElementById(
        'employeeInfo'
      )
      .innerHTML =
      '<span style="color:#ff7777">' +
      error.message +
      '</span>';
  }
}


/* =====================================================
   GET FACE DESCRIPTOR
===================================================== */

async function getFaceDescriptor() {

  const video =
    document
      .getElementById('video');

  if (!video.videoWidth) {

    throw new Error(
      'Kamera belum siap.'
    );
  }

  const detection =
    await faceapi

      .detectSingleFace(
        video,
        new faceapi
          .TinyFaceDetectorOptions({
            inputSize: 224,
            scoreThreshold: 0.5
          })
      )

      .withFaceLandmarks(
        true
      )

      .withFaceDescriptor();


  if (!detection) {

    throw new Error(
      'Wajah belum terdeteksi. Posisikan wajah di tengah lingkaran.'
    );
  }

  if (
    detection.detection.score <
    0.55
  ) {

    throw new Error(
      'Wajah kurang jelas. Dekatkan wajah dan perbaiki pencahayaan.'
    );
  }

  return Array.from(
    detection.descriptor
  );
}


/* =====================================================
   REGISTRASI FACE
===================================================== */

async function registerFace() {

  const nip =
    document
      .getElementById('nip')
      .value
      .trim();

  if (!nip) {

    showResult(
      'Masukkan NIP/NIK terlebih dahulu.',
      false
    );

    return;
  }

  try {

    await cekPegawai();

    if (!currentEmployee) {

      showResult(
        'Pegawai belum terdaftar.',
        false
      );

      return;
    }

    setStatus(
      'Menganalisis wajah...'
    );

    const descriptor =
      await getFaceDescriptor();

    setStatus(
      'Menyimpan Face ID...'
    );

    const result =
      await api(
        'saveFace',
        {
          nip: nip,
          descriptor:
            JSON.stringify(
              descriptor
            )
        }
      );

    if (result.success) {

      showResult(
        result.message,
        true
      );

      setStatus(
        'Face ID berhasil didaftarkan.'
      );

    } else {

      showResult(
        result.message,
        false
      );
    }

  } catch (error) {

    showResult(
      error.message,
      false
    );
  }
}


/* =====================================================
   ABSENSI
===================================================== */

async function absen(jenis) {

  const nip =
    document
      .getElementById('nip')
      .value
      .trim();

  if (!nip) {

    showResult(
      'Masukkan NIP/NIK terlebih dahulu.',
      false
    );

    return;
  }

  try {

    await cekPegawai();

    if (!currentEmployee) {

      throw new Error(
        'Pegawai belum terdaftar.'
      );
    }

    if (
      !currentEmployee.faceId
    ) {

      throw new Error(
        'Face ID belum didaftarkan oleh admin.'
      );
    }


    setStatus(
      'Mengambil lokasi GPS...'
    );

    const position =
      await getLocation();

    const lat =
      position.coords.latitude;

    const lng =
      position.coords.longitude;

    const accuracy =
      position.coords.accuracy;


    setStatus(
      'Memeriksa wajah...'
    );

    const descriptor =
      await getFaceDescriptor();


    setStatus(
      'Memverifikasi GPS dan wajah...'
    );


    const result =
      await api(
        'attendance',
        {

          nip: nip,

          jenis: jenis,

          lat: lat,

          lng: lng,

          accuracy: accuracy,

          descriptor:
            JSON.stringify(
              descriptor
            )
        }
      );


    if (result.success) {

      showResult(

        '✅ ' +
        result.message +

        '<br>Nama: ' +
        escapeHtml(
          result.nama
        ) +

        '<br>Waktu: ' +
        result.waktu +

        '<br>Jarak: ' +
        result.jarak +
        ' meter',

        true

      );

      setStatus(
        'Absensi berhasil.'
      );

    } else {

      showResult(
        result.message,
        false
      );

      setStatus(
        result.message
      );
    }

  } catch (error) {

    showResult(
      error.message,
      false
    );

    setStatus(
      error.message
    );
  }
}


/* =====================================================
   GPS
===================================================== */

function getLocation() {

  return new Promise(
    function(resolve, reject) {

      if (
        !navigator.geolocation
      ) {

        reject(
          new Error(
            'Browser tidak mendukung GPS.'
          )
        );

        return;
      }

      navigator.geolocation.getCurrentPosition(

        resolve,

        function(error) {

          reject(
            new Error(
              'GPS tidak dapat digunakan. ' +
              'Aktifkan Lokasi/GPS dan izinkan akses lokasi.'
            )
          );

        },

        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 0
        }

      );

    }
  );
}


/* =====================================================
   JSONP API
===================================================== */

function api(action, params) {

  return new Promise(
    function(resolve, reject) {

      const callback =
        'jsonp_' +
        Date.now() +
        '_' +
        Math.floor(
          Math.random() * 100000
        );

      window[callback] =
        function(data) {

          delete window[
            callback
          ];

          if (
            script.parentNode
          ) {

            script.parentNode
              .removeChild(
                script
              );
          }

          resolve(data);
        };


      let url =
        API_URL +
        '?action=' +
        encodeURIComponent(
          action
        ) +

        '&callback=' +
        callback;


      Object.keys(
        params || {}
      ).forEach(
        function(key) {

          url +=
            '&' +
            encodeURIComponent(
              key
            ) +
            '=' +
            encodeURIComponent(
              params[key]
            );
        }
      );


      const script =
        document.createElement(
          'script'
        );

      script.src = url;

      script.onerror =
        function() {

          delete window[
            callback
          ];

          reject(
            new Error(
              'Gagal terhubung ke server Google Apps Script.'
            )
          );
        };

      document
        .body
        .appendChild(
          script
        );


      setTimeout(
        function() {

          if (
            window[callback]
          ) {

            delete window[
              callback
            ];

            reject(
              new Error(
                'Server tidak memberikan respons.'
              )
            );
          }

        },
        30000
      );

    }
  );
}


/* =====================================================
   STATUS
===================================================== */

function setStatus(text) {

  document
    .getElementById('status')
    .textContent =
    text;
}


/* =====================================================
   RESULT
===================================================== */

function showResult(
  message,
  success
) {

  document
    .getElementById('result')
    .innerHTML =

    '<div class="' +
    (
      success
        ? 'success'
        : 'error'
    ) +
    '">' +

    message +

    '</div>';
}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(value) {

  return String(
    value || ''
  )
  .replace(
    /&/g,
    '&amp;'
  )
  .replace(
    /</g,
    '&lt;'
  )
  .replace(
    />/g,
    '&gt;'
  )
  .replace(
    /"/g,
    '&quot;'
  )
  .replace(
    /'/g,
    '&#039;'
  );
}

</script>

</body>
</html>
