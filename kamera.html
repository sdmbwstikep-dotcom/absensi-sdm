const q=new URLSearchParams(location.search);const api=q.get('api')||'';const token=q.get('token')||'';const mode=(q.get('mode')||'register').toLowerCase();const jenis=(q.get('jenis')||'MASUK').toUpperCase();const nip=q.get('nip')||'';const back=q.get('back')||'';let stream=null,modelsReady=false,busy=false,emp=null;
const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function status(t,c=''){$('status').className='status '+c;$('status').innerHTML=t}
function jsonp(params){return new Promise((resolve,reject)=>{const cb='sobai_cb_'+Date.now()+'_'+Math.floor(Math.random()*10000);const sc=document.createElement('script');params.callback=cb;params.token=token;window[cb]=d=>{cleanup();resolve(d)};function cleanup(){delete window[cb];sc.remove()}sc.onerror=()=>{cleanup();reject(new Error('Server SOBAI GAI tidak dapat dihubungi.'))};const u=new URL(api);Object.keys(params).forEach(k=>{if(params[k]!==undefined&&params[k]!==null)u.searchParams.set(k,params[k])});sc.src=u.toString();document.head.appendChild(sc);setTimeout(()=>{if(window[cb]){cleanup();reject(new Error('Waktu koneksi habis.'))}},30000)})}
async function init(){if(!api||!token||!nip){status('Tautan kamera tidak lengkap. Buka dari tombol Face ID/Absensi SOBAI GAI.','err');return}try{const r=await jsonp({api:'cameraEmployee',nip:nip});if(!r.success)throw new Error(r.message||'Pegawai tidak ditemukan.');emp=r.employee;$('employeeInfo').innerHTML='<b>'+esc(emp.nama)+'</b><br>'+esc(emp.nip)+' • '+esc(emp.jabatan)+'<br><b>'+esc(mode==='register'?'Pendaftaran Face ID':'Absensi '+jenis)+'</b>';status('Memuat mesin Face ID...');await loadModels();await startCamera()}catch(e){status(esc(e.message||e),'err')}}
async function loadModels(){if(modelsReady)return;const base='https://cdn.jsdelivr.net/gh/vladmandic/face-api/model';await Promise.all([faceapi.nets.tinyFaceDetector.loadFromUri(base),faceapi.nets.faceLandmark68TinyNet.loadFromUri(base),faceapi.nets.faceRecognitionNet.loadFromUri(base)]);modelsReady=true}
async function startCamera(){try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:720},height:{ideal:720}},audio:false});$('video').srcObject=stream;await new Promise(resolve=>{if($('video').readyState>=2)resolve();else $('video').onloadedmetadata=()=>resolve()});try{await $('video').play()}catch(e){};$('actionBtn').disabled=false;status('Kamera aktif. Pastikan wajah terlihat jelas.','ok')}catch(e){const n=e&&e.name;status(n==='NotAllowedError'?'Izin kamera ditolak oleh browser. Buka pengaturan situs dan izinkan kamera.':n==='NotFoundError'?'Kamera tidak ditemukan.':n==='NotReadableError'?'Kamera sedang dipakai aplikasi lain.':'Kamera gagal: '+(e.message||e),'err')}}
async function descriptor(){
const v=$('video');
if(!modelsReady) await loadModels();
if(v.readyState<2 || !v.videoWidth){throw new Error('Kamera belum siap. Tunggu sampai gambar kamera muncul lalu coba lagi.');}
try{await v.play();}catch(e){}
const c=document.createElement('canvas');
const w=Math.min(v.videoWidth||640,640); const h=Math.round(w*(v.videoHeight||480)/(v.videoWidth||640));
c.width=w; c.height=h; c.getContext('2d').drawImage(v,0,0,w,h);
const opt=new faceapi.TinyFaceDetectorOptions({inputSize:320,scoreThreshold:.35});
const detection=await Promise.race([
faceapi.detectSingleFace(c,opt).withFaceLandmarks(true).withFaceDescriptor(),
new Promise((_,rej)=>setTimeout(()=>rej(new Error('Deteksi wajah terlalu lama. Pastikan wajah terang dan berada di tengah panduan, lalu coba lagi.')),10000))
]);
if(!detection)throw new Error('Wajah belum terdeteksi. Posisikan wajah di dalam panduan dan pastikan pencahayaan cukup.');
return Array.from(detection.descriptor)
}
function photo(){const c=document.createElement('canvas');const v=$('video');const w=Math.min(v.videoWidth||360,360);const h=Math.round(w*(v.videoHeight||480)/(v.videoWidth||640));c.width=w;c.height=h;c.getContext('2d').drawImage(v,0,0,w,h);return c.toDataURL('image/jpeg',.35)}
async function postAttendance(data, descriptor, gpsData){
  status('<span class="spinner"></span> Mengirim absensi dan foto...');
  const frame=document.createElement('iframe'); frame.name='sobai_post_frame_'+Date.now(); frame.style.display='none'; document.body.appendChild(frame);
  const form=document.createElement('form'); form.method='POST'; form.action=api; form.target=frame.name; form.style.display='none';
  const fields={action:'saveattendance',token:token,nip:nip,jenis:jenis,latitude:gpsData.coords.latitude,longitude:gpsData.coords.longitude,accuracy:gpsData.coords.accuracy,descriptor:JSON.stringify(descriptor),photoData:data,keterangan:''};
  Object.keys(fields).forEach(k=>{const input=document.createElement('input');input.type='hidden';input.name=k;input.value=fields[k] == null ? '' : String(fields[k]);form.appendChild(input)});
  document.body.appendChild(form); form.submit(); form.remove();
  for(let i=0;i<30;i++){
    await new Promise(r=>setTimeout(r,1000));
    try{const r=await jsonp({api:'cameraStatus'});if(r && r.ready){frame.remove();if(!r.result)throw new Error(r.message||'Server tidak mengembalikan hasil.');if(!r.result.success)throw new Error(r.result.message||'Absensi gagal.');return r.result}}catch(e){if(i===29){frame.remove();throw e}}
  }
  frame.remove(); throw new Error('Server belum mengembalikan hasil. Silakan coba lagi.');
}
function gps(){return new Promise((resolve,reject)=>{if(!navigator.geolocation)return reject(new Error('GPS tidak tersedia.'));navigator.geolocation.getCurrentPosition(resolve,reject,{enableHighAccuracy:true,timeout:15000,maximumAge:0})})}
async function processAction(){if(busy)return;busy=true;$('actionBtn').disabled=true;try{status('<span class="spinner"></span> Mendeteksi wajah...');const d=await descriptor();if(mode==='register'){status('<span class="spinner"></span> Menyimpan Face ID...');const r=await jsonp({api:'saveFaceId',nip:nip,descriptor:JSON.stringify(d)});if(!r.success)throw new Error(r.message||'Face ID gagal disimpan.');status('Face ID berhasil didaftarkan untuk <b>'+esc(emp.nama)+'</b>.','ok');$('actionBtn').textContent='Selesai';setTimeout(goBack,1800);return}status('<span class="spinner"></span> Membaca GPS...');const p=await gps();status('<span class="spinner"></span> Memverifikasi Face ID, GPS, dan absensi...');const r=await postAttendance(photo(),d,p);status('ABSENSI BERHASIL<br><b>'+esc(r.status)+'</b><br>Jarak kantor: '+Math.round(r.distance)+' meter','ok');$('actionBtn').textContent='Selesai';setTimeout(goBack,2200)}catch(e){status(esc(e.message||e),'err')}finally{busy=false;if($('actionBtn').textContent!=='Selesai')$('actionBtn').disabled=false}}
function goBack(){if(stream)stream.getTracks().forEach(t=>t.stop());if(back)location.href=decodeURIComponent(back);else location.href=api+'?page='+encodeURIComponent(mode==='register'?'admin':'pegawai')+(mode==='register'?'':'&nip='+encodeURIComponent(nip))}window.addEventListener('beforeunload',()=>{if(stream)stream.getTracks().forEach(t=>t.stop())});init();
</script></body></html>
