<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>Absensi Wajah</title>


<!-- Face API -->
<script
  src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/dist/face-api.js">
</script>


<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  font-family:
    Arial,
    sans-serif;

  background: #171717;

  color: white;

}


.header {

  background: #b00000;

  text-align: center;

  padding: 18px;

}


.header h1 {

  margin: 0;

  font-size: 25px;

}


.header p {

  margin: 5px 0 0;

}


.container {

  max-width: 700px;

  margin: auto;

  padding: 15px;

}


.card {

  background: #222;

  border-radius: 15px;

  padding: 15px;

  margin-bottom: 15px;

}


label {

  display: block;

  font-weight: bold;

  margin-bottom: 7px;

}


input {

  width: 100%;

  padding: 14px;

  border-radius: 8px;

  border: 1px solid #bbb;

  font-size: 16px;

}


.camera-box {

  position: relative;

  width: 100%;

  aspect-ratio: 4 / 3;

  background: black;

  border-radius: 15px;

  overflow: hidden;

  margin-top: 15px;

}


video {

  width: 100%;

  height: 100%;

  object-fit: cover;

  transform: scaleX(-1);

}


.face-guide {

  position: absolute;

  left: 50%;

  top: 50%;

  width: 65%;

  height: 65%;

  transform:
    translate(-50%, -50%);

  border: 3px solid white;

  border-radius: 50%;

  pointer-events: none;

}


.status {

  padding: 13px;

  border-radius: 8px;

  margin-top: 12px;

  text-align: center;

}


.info {

  background: #333;

}


.success {

  background: #075c28;

}


.error {

  background: #7d0000;

}


.warning {

  background: #705500;

}


button {

  width: 100%;

  border: 0;

  border-radius: 9px;

  padding: 15px;

  font-size: 16px;

  font-weight: bold;

  color: white;

  margin-top: 10px;

}


.red {

  background: #b00000;

}


.green {

  background: #137b38;

}


.blue {

  background: #1769aa;

}


button:disabled {

  opacity: .5;

}


.employee {

  font-size: 18px;

  line-height: 1.6;

}


.small {

  font-size: 13px;

  color: #ccc;

}


</style>

</head>


<body>


<div class="header">

  <h1>
    ABSENSI WAJAH
  </h1>

  <p>
    Bawaslu Kota Tidore Kepulauan
  </p>

</div>


<div class="container">


  <!-- IDENTITAS -->
  <div class="card">

    <label>
      NIP / NIK Pegawai
    </label>

    <input
      id="nip"
      placeholder="Masukkan NIP/NIK"
    >

    <button
      class="blue"
      onclick="checkEmployee()"
    >
      🔍 CEK PEGAWAI
    </button>


    <div
      id="employeeInfo"
      class="employee">
    </div>

  </div>


  <!-- KAMERA -->
  <div class="card">

    <div class="camera-box">

      <video
        id="video"
        autoplay
        muted
        playsinline>
      </video>

      <div class="face-guide"></div>

    </div>


    <div
      id="cameraStatus"
      class="status info"
    >
      Menyiapkan sistem kamera...
    </div>


    <button
      id="registerButton"
      class="red"
      onclick="registerFace()"
      disabled
    >
      🔐 DAFTARKAN WAJAH
    </button>


    <button
      id="masukButton"
      class="green"
      onclick="doAttendance('MASUK')"
      disabled
    >
      ✓ ABSEN MASUK
    </button>


    <button
      id="pulangButton"
      class="red"
      onclick="doAttendance('PULANG')"
      disabled
    >
      ↪ ABSEN PULANG
    </button>

  </div>


  <!-- GPS -->
  <div class="card">

    <h3>
      📍 Lokasi GPS
    </h3>

    <div id="gpsInfo">
      Menunggu lokasi...
    </div>

  </div>


  <div class="card small">

    Sistem absensi menggunakan:

    <br>

    • GPS kantor

    <br>

    • Face ID

    <br>

    • Google Apps Script

    <br>

    • Google Sheets

  </div>


</div>


<script>


/************************************************************
 * KONFIGURASI
 ************************************************************/

const API_URL =
  'https://script.google.com/macros/s/AKfycbxO97It0vd-zPX-Qhz322uVxjgdmRHj0w5po0qGgLnJ9SpDHvlhHXv1iEP8YjUumgw/exec';


const MODEL_URL =
  'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/model';


let video =
  document.getElementById('video');


let stream = null;

let modelsReady = false;

let currentEmployee = null;

let currentPosition = null;


/************************************************************
 * JSONP
 ************************************************************/
function jsonp(params) {

  return new Promise(function(resolve, reject) {

    const callbackName =
      'cb_' +
      Date.now() +
      '_' +
      Math.floor(
        Math.random() * 100000
      );


    const script =
      document.createElement('script');


    const query =
      new URLSearchParams(params);


    query.set(
      'callback',
      callbackName
    );


    script.src =
      API_URL +
      '?' +
      query.toString();


    window[callbackName] =
      function(data) {

        cleanup();

        resolve(data);

      };


    script.onerror =
      function() {

        cleanup();

        reject(
          new Error(
            'Gagal terhubung ke server Google Apps Script.'
          )
        );

      };


    document.body.appendChild(script);


    function cleanup() {

      delete window[callbackName];

      script.remove();

    }


    setTimeout(function() {

      if (window[callbackName]) {

        cleanup();

        reject(
          new Error(
            'Server tidak merespons.'
          )
        );

      }

    }, 20000);

  });

}


/************************************************************
 * STATUS
 ************************************************************/
function status(text, type) {

  const el =
    document.getElementById(
      'cameraStatus'
    );

  el.textContent = text;

  el.className =
    'status ' +
    (type || 'info');

}


/************************************************************
 * LOAD FACE API
 ************************************************************/
async function loadModels() {

  status(
    'Memuat sistem pengenalan wajah...',
    'warning'
  );


  try {

    await Promise.all([

      faceapi.nets.tinyFaceDetector.loadFromUri(
        MODEL_URL
      ),

      faceapi.nets.faceLandmark68TinyNet.loadFromUri(
        MODEL_URL
      ),

      faceapi.nets.faceRecognitionNet.loadFromUri(
        MODEL_URL
      )

    ]);


    modelsReady = true;


    status(
      'Sistem wajah siap. Menyalakan kamera...',
      'success'
    );


    await startCamera();


  } catch (err) {

    console.error(err);

    status(
      'Gagal memuat sistem wajah: ' +
      err.message,
      'error'
    );

  }

}


/************************************************************
 * KAMERA
 ************************************************************/
async function startCamera() {

  try {

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        'Browser tidak mendukung kamera.'
      );

    }


    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: {
            ideal: 'user'
          },

          width: {
            ideal: 640
          },

          height: {
            ideal: 480
          }
        },

        audio: false

      });


    video.srcObject = stream;


    status(
      'Kamera aktif. Masukkan NIP/NIK.',
      'success'
    );


  } catch (err) {

    console.error(err);


    let msg =
      'Gagal menyiapkan kamera: ' +
      err.message;


    if (
      err.name ===
      'NotAllowedError'
    ) {

      msg =
        'Izin kamera ditolak. ' +
        'Izinkan kamera pada Chrome lalu buka ulang halaman.';

    }


    if (
      err.name ===
      'NotFoundError'
    ) {

      msg =
        'Kamera tidak ditemukan pada perangkat.';

    }


    if (
      err.name ===
      'NotReadableError'
    ) {

      msg =
        'Kamera sedang digunakan aplikasi lain.';

    }


    status(
      msg,
      'error'
    );

  }

}


/************************************************************
 * CEK PEGAWAI
 ************************************************************/
async function checkEmployee() {

  const nip =
    document.getElementById(
      'nip'
    ).value.trim();


  if (!nip) {

    alert(
      'Masukkan NIP/NIK terlebih dahulu.'
    );

    return;

  }


  status(
    'Memeriksa data pegawai...',
    'warning'
  );


  try {

    const res =
      await jsonp({

        action:
          'employee',

        nip:
          nip

      });


    if (!res.success) {

      currentEmployee = null;

      document.getElementById(
        'employeeInfo'
      ).innerHTML =
        '<span style="color:#ff7777">' +
        res.message +
        '</span>';


      disableButtons();

      status(
        res.message,
        'error'
      );

      return;

    }


    currentEmployee =
      res.employee;


    document.getElementById(
      'employeeInfo'
    ).innerHTML =

      '<b>' +
      escapeHtml(
        currentEmployee.nama
      ) +
      '</b><br>' +

      escapeHtml(
        currentEmployee.jabatan
      ) +
      '<br>' +

      escapeHtml(
        currentEmployee.unit
      ) +
      '<br>' +

      (
        currentEmployee.faceRegistered
          ? '🔐 Face ID sudah terdaftar'
          : '⚠️ Face ID belum terdaftar'
      );


    status(
      'Pegawai ditemukan. Posisikan wajah di dalam lingkaran.',
      'success'
    );


    document.getElementById(
      'registerButton'
    ).disabled =
      !modelsReady;


    document.getElementById(
      'masukButton'
    ).disabled =
      !modelsReady ||
      !currentEmployee.faceRegistered;


    document.getElementById(
      'pulangButton'
    ).disabled =
      !modelsReady ||
      !currentEmployee.faceRegistered;


  } catch (err) {

    status(
      err.message,
      'error'
    );

  }

}


/************************************************************
 * AMBIL FACE DESCRIPTOR
 ************************************************************/
async function getFaceDescriptor() {

  if (!modelsReady) {

    throw new Error(
      'Sistem Face ID belum siap.'
    );

  }


  const detection =
    await faceapi
      .detectSingleFace(
        video,
        new faceapi.TinyFaceDetectorOptions({
          inputSize: 224,
          scoreThreshold: 0.5
        })
      )
      .withFaceLandmarks(true)
      .withFaceDescriptor();


  if (!detection) {

    throw new Error(
      'Wajah tidak terdeteksi. Posisikan wajah tepat di tengah kamera.'
    );

  }


  const box =
    detection.detection.box;


  const videoWidth =
    video.videoWidth;


  const videoHeight =
    video.videoHeight;


  const centerX =
    box.x + box.width / 2;


  const centerY =
    box.y + box.height / 2;


  const toleranceX =
    videoWidth * 0.30;


  const toleranceY =
    videoHeight * 0.30;


  if (
    Math.abs(
      centerX -
      videoWidth / 2
    ) > toleranceX
  ) {

    throw new Error(
      'Posisikan wajah di tengah.'
    );

  }


  if (
    Math.abs(
      centerY -
      videoHeight / 2
    ) > toleranceY
  ) {

    throw new Error(
      'Posisikan wajah di tengah.'
    );

  }


  return Array.from(
    detection.descriptor
  );

}


/************************************************************
 * DAFTARKAN FACE ID
 ************************************************************/
async function registerFace() {

  if (!currentEmployee) {

    alert(
      'Cek pegawai terlebih dahulu.'
    );

    return;

  }


  const button =
    document.getElementById(
      'registerButton'
    );


  button.disabled = true;


  status(
    'Membaca wajah. Jangan bergerak...',
    'warning'
  );


  try {

    const descriptor =
      await getFaceDescriptor();


    const res =
      await jsonp({

        action:
          'registerFace',

        nip:
          currentEmployee.nip,

        descriptor:
          JSON.stringify(
            descriptor
          )

      });


    if (!res.success) {

      status(
        res.message,
        'error'
      );

      button.disabled = false;

      return;

    }


    currentEmployee.faceRegistered =
      true;


    document.getElementById(
      'employeeInfo'
    ).innerHTML =

      '<b>' +
      escapeHtml(
        currentEmployee.nama
      ) +
      '</b><br>' +

      escapeHtml(
        currentEmployee.jabatan
      ) +
      '<br>' +

      '🔐 Face ID sudah terdaftar';


    document.getElementById(
      'masukButton'
    ).disabled = false;


    document.getElementById(
      'pulangButton'
    ).disabled = false;


    status(
      res.message,
      'success'
    );


  } catch (err) {

    status(
      err.message,
      'error'
    );

    button.disabled = false;

  }

}


/************************************************************
 * GPS
 ************************************************************/
function getGPS() {

  return new Promise(function(resolve, reject) {

    if (!navigator.geolocation) {

      reject(
        new Error(
          'Browser tidak mendukung GPS.'
        )
      );

      return;

    }


    navigator.geolocation.getCurrentPosition(

      function(position) {

        currentPosition =
          position;


        const lat =
          position.coords.latitude;


        const lng =
          position.coords.longitude;


        const accuracy =
          position.coords.accuracy;


        document.getElementById(
          'gpsInfo'
        ).innerHTML =

          'Latitude: ' +
          lat.toFixed(6) +
          '<br>' +

          'Longitude: ' +
          lng.toFixed(6) +
          '<br>' +

          'Akurasi: ±' +
          Math.round(
            accuracy
          ) +
          ' meter';


        resolve(position);

      },


      function(error) {

        reject(
          new Error(
            'GPS tidak dapat diperoleh: ' +
            error.message
          )
        );

      },


      {
        enableHighAccuracy: true,

        timeout: 15000,

        maximumAge: 0

      }

    );

  });

}


/************************************************************
 * ABSENSI
 ************************************************************/
async function doAttendance(jenis) {

  if (!currentEmployee) {

    alert(
      'Cek pegawai terlebih dahulu.'
    );

    return;

  }


  if (
    !currentEmployee.faceRegistered
  ) {

    alert(
      'Face ID belum terdaftar.'
    );

    return;

  }


  const masuk =
    jenis === 'MASUK';


  const button =
    document.getElementById(
      masuk
        ? 'masukButton'
        : 'pulangButton'
    );


  button.disabled = true;


  try {

    status(
      'Mengambil lokasi GPS...',
      'warning'
    );


    const position =
      await getGPS();


    status(
      'Memverifikasi wajah...',
      'warning'
    );


    const descriptor =
      await getFaceDescriptor();


    status(
      'Mengirim absensi...',
      'warning'
    );


    const res =
      await jsonp({

        action:
          'attendance',

        nip:
          currentEmployee.nip,

        jenis:
          jenis,

        descriptor:
          JSON.stringify(
            descriptor
          ),

        latitude:
          position.coords.latitude,

        longitude:
          position.coords.longitude,

        accuracy:
          position.coords.accuracy

      });


    if (!res.success) {

      status(
        res.message,
        'error'
      );

      alert(
        res.message
      );

      button.disabled = false;

      return;

    }


    status(
      res.message +
      ' | Jarak: ' +
      Math.round(
        res.jarak
      ) +
      ' m',
      'success'
    );


    alert(
      res.message +
      '\n\n' +
      'Nama: ' +
      res.nama +
      '\n' +
      'Waktu: ' +
      res.waktu +
      '\n' +
      'Jarak: ' +
      Math.round(
        res.jarak
      ) +
      ' meter'
    );


    button.disabled = false;


  } catch (err) {

    console.error(err);


    status(
      err.message,
      'error'
    );


    alert(
      err.message
    );


    button.disabled = false;

  }

}


/************************************************************
 * DISABLE
 ************************************************************/
function disableButtons() {

  document.getElementById(
    'registerButton'
  ).disabled = true;


  document.getElementById(
    'masukButton'
  ).disabled = true;


  document.getElementById(
    'pulangButton'
  ).disabled = true;

}


/************************************************************
 * HTML ESCAPE
 ************************************************************/
function escapeHtml(value) {

  return String(value || '')
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );

}


/************************************************************
 * START
 ************************************************************/
window.addEventListener(
  'load',
  function() {

    loadModels();

  }
);


</script>

</body>

</html>
