<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0">

<title>Kamera Absensi SDM</title>

<script
src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/dist/face-api.js">
</script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #151515;
  color: white;
}

.header {
  background: #a90000;
  padding: 15px;
  text-align: center;
}

.header h1 {
  margin: 0;
  font-size: 22px;
}

.container {
  width: 95%;
  max-width: 650px;
  margin: 15px auto;
}

.card {
  background: #222;
  border-radius: 15px;
  padding: 15px;
  margin-bottom: 15px;
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 6px;
}

input {
  width: 100%;
  padding: 13px;
  border-radius: 8px;
  border: 1px solid #aaa;
  font-size: 17px;
}

.camera {
  width: 100%;
  background: #000;
  border-radius: 15px;
  overflow: hidden;
  position: relative;
}

video {
  width: 100%;
  display: block;
  transform: scaleX(-1);
}

.face-guide {
  position: absolute;
  width: 65%;
  height: 70%;
  left: 17.5%;
  top: 15%;
  border: 3px solid white;
  border-radius: 45%;
  pointer-events: none;
}

.status {
  padding: 13px;
  border-radius: 9px;
  margin-top: 12px;
  text-align: center;
}

.info {
  background: #444;
}

.success {
  background: #145c2c;
}

.error {
  background: #7a0000;
}

.warning {
  background: #705400;
}

.buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 12px;
}

button {
  padding: 15px;
  border: none;
  border-radius: 9px;
  font-weight: bold;
  font-size: 16px;
  cursor: pointer;
}

.green {
  background: #198754;
  color: white;
}

.red {
  background: #a90000;
  color: white;
}

.blue {
  background: #1267b1;
  color: white;
}

button:disabled {
  opacity: .4;
}

.result {
  text-align: center;
  font-size: 17px;
  line-height: 1.6;
}

.small {
  font-size: 13px;
  color: #bbb;
  text-align: center;
}

</style>

</head>

<body>

<div class="header">

  <h1>ABSENSI WAJAH</h1>

  <div>
    Bawaslu Kota Tidore Kepulauan
  </div>

</div>


<div class="container">


  <!-- =====================================================
       NIP
       ===================================================== -->

  <div class="card">

    <label>
      NIP / NIK Pegawai
    </label>

    <input
      id="nip"
      placeholder="Masukkan NIP/NIK">

  </div>


  <!-- =====================================================
       CAMERA
       ===================================================== -->

  <div class="card">

    <div class="camera">

      <video
        id="video"
        autoplay
        muted
        playsinline>
      </video>

      <div class="face-guide"></div>

    </div>

    <div
      id="status"
      class="status info">

      Menyiapkan kamera...

    </div>

    <div class="buttons">

      <button
        id="btnMasuk"
        class="green"
        disabled
        onclick="absen('MASUK')">

        ✓ ABSEN MASUK

      </button>

      <button
        id="btnPulang"
        class="red"
        disabled
        onclick="absen('PULANG')">

        ↪ ABSEN PULANG

      </button>

    </div>

  </div>


  <!-- =====================================================
       REGISTRATION
       ===================================================== -->

  <div
    id="registerBox"
    class="card hidden">

    <h2>
      🔐 Registrasi Face ID
    </h2>

    <p>
      Posisikan satu wajah di tengah
      bingkai dan gunakan pencahayaan
      yang cukup.
    </p>

    <button
      id="btnRegister"
      class="red"
      style="width:100%"
      onclick="registerFace()">

      DAFTARKAN WAJAH

    </button>

  </div>


  <div
    id="result"
    class="card result hidden">
  </div>


  <p class="small">

    Pastikan GPS aktif dan izinkan
    akses kamera serta lokasi.

  </p>

</div>


<script>

/* ==========================================================
   KONFIGURASI
   ========================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );

const mode =
  params.get('mode') ||
  'attendance';

const nipParam =
  params.get('nip') ||
  '';


/* ==========================================================
   STATE
   ========================================================== */

let video =
  document.getElementById('video');

let stream = null;

let modelsReady = false;

let cameraReady = false;


/* ==========================================================
   INIT
   ========================================================== */

window.addEventListener(
  'load',
  init
);


async function init() {

  if (nipParam) {

    document.getElementById(
      'nip'
    ).value =
      nipParam;
  }

  if (mode === 'register') {

    document
      .getElementById(
        'registerBox'
      )
      .classList
      .remove('hidden');

    document
      .getElementById(
        'btnMasuk'
      )
      .style.display =
      'none';

    document
      .getElementById(
        'btnPulang'
      )
      .style.display =
      'none';

  } else {

    document
      .getElementById(
        'registerBox'
      )
      .classList
      .add('hidden');
  }

  try {

    setStatus(
      'Memuat sistem pengenalan wajah...',
      'warning'
    );

    await loadModels();

    modelsReady = true;

    setStatus(
      'Memulai kamera...',
      'warning'
    );

    await startCamera();

    cameraReady = true;

    if (mode === 'register') {

      setStatus(
        'Kamera siap. Posisikan wajah di tengah.',
        'success'
      );

      document
        .getElementById(
          'btnRegister'
        )
        .disabled = false;

    } else {

      setStatus(
        'Kamera siap. Masukkan NIP/NIK.',
        'success'
      );

      document
        .getElementById(
          'btnMasuk'
        )
        .disabled = false;

      document
        .getElementById(
          'btnPulang'
        )
        .disabled = false;
    }

  } catch (err) {

    console.error(err);

    setStatus(
      'Gagal menyiapkan kamera: ' +
      err.message,
      'error'
    );
  }
}


/* ==========================================================
   LOAD FACE MODELS
   ========================================================== */

async function loadModels() {

  const MODEL_URL =
    'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/model';

  await faceapi.nets.tinyFaceDetector
    .loadFromUri(
      MODEL_URL
    );

  await faceapi.nets.faceLandmark68Net
    .loadFromUri(
      MODEL_URL
    );

  await faceapi.nets.faceRecognitionNet
    .loadFromUri(
      MODEL_URL
    );
}


/* ==========================================================
   CAMERA
   ========================================================== */

async function startCamera() {

  if (!navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia) {

    throw new Error(
      'Browser tidak mendukung kamera.'
    );
  }

  stream =
    await navigator.mediaDevices
      .getUserMedia({

        video: {

          facingMode:
            'user',

          width: {
            ideal: 640
          },

          height: {
            ideal: 480
          }
        },

        audio: false
      });

  video.srcObject =
    stream;

  await new Promise(
    function(resolve) {

      video.onloadedmetadata =
        function() {

          resolve();
        };
    }
  );
}


/* ==========================================================
   NIP
   ========================================================== */

function getNip() {

  return document
    .getElementById('nip')
    .value
    .trim();
}


/* ==========================================================
   DETECT FACE
   ========================================================== */

async function getFaceDescriptor() {

  const detection =
    await faceapi
      .detectSingleFace(
        video,
        new faceapi.TinyFaceDetectorOptions({
          inputSize: 320,
          scoreThreshold: 0.5
        })
      )
      .withFaceLandmarks()
      .withFaceDescriptor();

  if (!detection) {

    throw new Error(
      'Wajah belum terdeteksi. Posisikan wajah di tengah.'
    );
  }

  return Array.from(
    detection.descriptor
  );
}


/* ==========================================================
   FOTO
   ========================================================== */

function capturePhoto() {

  const canvas =
    document.createElement(
      'canvas'
    );

  const maxWidth = 640;

  const ratio =
    Math.min(
      1,
      maxWidth /
      video.videoWidth
    );

  canvas.width =
    Math.round(
      video.videoWidth * ratio
    );

  canvas.height =
    Math.round(
      video.videoHeight * ratio
    );

  const ctx =
    canvas.getContext('2d');

  // Kamera selfie.
  ctx.translate(
    canvas.width,
    0
  );

  ctx.scale(
    -1,
    1
  );

  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );

  return canvas.toDataURL(
    'image/jpeg',
    0.65
  );
}


/* ==========================================================
   GPS
   ========================================================== */

function getLocation() {

  return new Promise(
    function(resolve, reject) {

      if (
        !navigator.geolocation
      ) {

        reject(
          new Error(
            'GPS tidak didukung browser.'
          )
        );

        return;
      }

      navigator.geolocation.getCurrentPosition(

        function(position) {

          resolve({

            latitude:
              position.coords.latitude,

            longitude:
              position.coords.longitude,

            accuracy:
              position.coords.accuracy

          });

        },

        function(error) {

          let message =
            'GPS gagal.';

          if (
            error.code ===
            error.PERMISSION_DENIED
          ) {

            message =
              'Izin lokasi ditolak. Aktifkan GPS dan izinkan lokasi.';
          }

          if (
            error.code ===
            error.POSITION_UNAVAILABLE
          ) {

            message =
              'Lokasi GPS tidak tersedia.';
          }

          if (
            error.code ===
            error.TIMEOUT
          ) {

            message =
              'Pengambilan lokasi GPS timeout.';
          }

          reject(
            new Error(message)
          );
        },

        {

          enableHighAccuracy:
            true,

          timeout:
            15000,

          maximumAge:
            0
        }
      );
    }
  );
}


/* ==========================================================
   ABSEN
   ========================================================== */

async function absen(jenis) {

  const nip =
    getNip();

  if (!nip) {

    setStatus(
      'Masukkan NIP/NIK terlebih dahulu.',
      'error'
    );

    return;
  }

  if (!modelsReady ||
      !cameraReady) {

    setStatus(
      'Kamera belum siap.',
      'warning'
    );

    return;
  }

  disableAttendanceButtons(
    true
  );

  try {

    setStatus(
      'Membaca wajah...',
      'warning'
    );

    const descriptor =
      await getFaceDescriptor();

    setStatus(
      'Mengambil foto...',
      'warning'
    );

    const photo =
      capturePhoto();

    setStatus(
      'Mengambil lokasi GPS...',
      'warning'
    );

    const location =
      await getLocation();

    setStatus(
      'Mengirim data absensi...',
      'warning'
    );

    sendToParent({

      type:
        'ATTENDANCE_DATA',

      payload: {

        nip:
          nip,

        jenis:
          jenis,

        latitude:
          location.latitude,

        longitude:
          location.longitude,

        accuracy:
          location.accuracy,

        descriptor:
          descriptor,

        photo:
          photo
      }
    });

    setStatus(
      'Data dikirim ke server. Tunggu hasil...',
      'success'
    );

  } catch (err) {

    setStatus(
      err.message,
      'error'
    );

    disableAttendanceButtons(
      false
    );
  }
}


/* ==========================================================
   REGISTER FACE
   ========================================================== */

async function registerFace() {

  const nip =
    getNip();

  if (!nip) {

    setStatus(
      'NIP/NIK belum diisi.',
      'error'
    );

    return;
  }

  try {

    document
      .getElementById(
        'btnRegister'
      )
      .disabled = true;

    setStatus(
      'Membaca wajah...',
      'warning'
    );

    const descriptor =
      await getFaceDescriptor();

    const photo =
      capturePhoto();

    sendToParent({

      type:
        'FACE_REGISTER_DATA',

      payload: {

        nip:
          nip,

        descriptor:
          descriptor,

        photo:
          photo
      }
    });

    setStatus(
      'Face ID dikirim ke portal admin.',
      'success'
    );

  } catch (err) {

    setStatus(
      err.message,
      'error'
    );

    document
      .getElementById(
        'btnRegister'
      )
      .disabled = false;
  }
}


/* ==========================================================
   SEND MESSAGE TO PARENT
   ========================================================== */

function sendToParent(message) {

  if (
    window.parent &&
    window.parent !== window
  ) {

    window.parent.postMessage(
      message,
      'https://script.google.com'
    );

    // Apps Script dapat memiliki
    // origin script.google.com.
    // Untuk keamanan tambahan,
    // juga kirim ke opener bila tersedia.
  }

  if (
    window.opener
  ) {

    window.opener.postMessage(
      message,
      'https://script.google.com'
    );
  }
}


/* ==========================================================
   STATUS
   ========================================================== */

function setStatus(
  text,
  type
) {

  const box =
    document.getElementById(
      'status'
    );

  box.className =
    'status ' +
    type;

  box.textContent =
    text;
}


/* ==========================================================
   BUTTON
   ========================================================== */

function disableAttendanceButtons(
  disabled
) {

  document
    .getElementById(
      'btnMasuk'
    )
    .disabled =
    disabled;

  document
    .getElementById(
      'btnPulang'
    )
    .disabled =
    disabled;
}

</script>

</body>
</html>
